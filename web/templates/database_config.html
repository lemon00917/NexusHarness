<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据源配置 — CDR Agent</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body { overflow: auto; }
        .dc-container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .dc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); }
        .dc-header h1 { font-size: 18px; }
        .dc-header a { color: var(--text-dim); text-decoration: none; font-size: 12px; }
        .dc-card { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
        .dc-card h3 { font-size: 13px; margin-bottom: 14px; color: var(--accent); }
        .dc-row { display: flex; gap: 12px; margin-bottom: 12px; align-items: center; }
        .dc-row label { width: 100px; font-size: 12px; color: var(--text-secondary); flex-shrink: 0; }
        .dc-row input, .dc-row select { flex: 1; padding: 8px 12px; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-primary); font-size: 13px; font-family: var(--font-body); }
        .dc-row input:focus, .dc-row select:focus { border-color: var(--accent); outline: none; }
        .dc-save { position: sticky; bottom: 0; padding: 14px 20px; background: var(--bg-elevated); border-top: 1px solid var(--border-color); display: flex; gap: 10px; justify-content: flex-end; }
        .btn { padding: 8px 20px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 500; cursor: pointer; font-family: var(--font-body); border: none; }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border-color); }
        .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--bg-elevated); color: var(--text-primary); padding: 10px 22px; border-radius: var(--radius-sm); border: 1px solid var(--border-color); font-size: 13px; z-index: 9999; }
        .dc-test { font-size: 11px; padding: 4px 10px; border-radius: 6px; margin-left: 8px; }
        .dc-test.ok { background: rgba(34,197,94,.12); color: var(--accent-green); }
        .dc-test.fail { background: rgba(239,68,68,.12); color: var(--accent-red); }
        .dc-help { margin: -4px 0 12px 112px; color: var(--text-dim); font-size: 11px; line-height: 1.6; }
        .dc-help a { color: var(--accent); text-decoration: none; }
        .dc-help a:hover { text-decoration: underline; }
        .dc-check { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-secondary); }
        .dc-check input { width: auto; flex: none; }
        .dc-status { font-size: 11px; color: var(--text-dim); line-height: 1.6; }
    </style>
</head>
<body>
<div class="dc-container">
    <div class="dc-header">
        <h1>🗄️ 数据源配置</h1>
        <a href="/">← CDR Agent</a>
    </div>
    <div class="dc-card">
        <h3>数据库类型</h3>
        <div class="dc-row">
            <label>类型</label>
            <select id="dbType" onchange="onTypeChange()">
                <option value="iris">IRIS</option>
                <option value="mysql">MySQL</option>
            </select>
        </div>
    </div>
    <div class="dc-card" id="irisConfig">
        <h3>IRIS 配置</h3>
        <div class="dc-row"><label>Base URL</label><input id="irisUrl" placeholder="http://124.222.57.198:52773"></div>
        <div class="dc-row"><label>Namespace</label><input id="irisNs" placeholder="HDCV2DEV"></div>
        <div class="dc-row"><label>Schema</label><input id="irisSchema" placeholder="hdc_userv2"></div>
        <div class="dc-row"><label>Username</label><input id="irisUser" placeholder="_system"></div>
        <div class="dc-row"><label>Password</label><input id="irisPass" type="password" placeholder="****"></div>
        <button class="btn btn-ghost" onclick="testDB('iris')">测试连接</button>
        <span id="irisTest"></span>
    </div>
    <div class="dc-card" id="mysqlConfig" style="display:none">
        <h3>MySQL 配置</h3>
        <div class="dc-row"><label>Host</label><input id="mysqlHost" placeholder="127.0.0.1"></div>
        <div class="dc-row"><label>Port</label><input id="mysqlPort" placeholder="3306" type="number"></div>
        <div class="dc-row"><label>Database</label><input id="mysqlDb" placeholder="hdc_userv2"></div>
        <div class="dc-row"><label>User</label><input id="mysqlUser" placeholder="root"></div>
        <div class="dc-row"><label>Password</label><input id="mysqlPass" type="password" placeholder="****"></div>
        <button class="btn btn-ghost" onclick="testDB('mysql')">测试连接</button>
        <span id="mysqlTest"></span>
    </div>
    <div class="dc-card" id="dmpConfig">
        <h3>DMP 数据源</h3>
        <div class="dc-row"><label>Host</label><input id="dmpHost" placeholder="127.0.0.1"></div>
        <div class="dc-row"><label>Port</label><input id="dmpPort" placeholder="5432" type="number"></div>
        <div class="dc-row"><label>Database</label><input id="dmpDatabase" placeholder="dmp"></div>
        <div class="dc-row"><label>Schema</label><input id="dmpSchema" placeholder="sm_dmp"></div>
        <div class="dc-row"><label>User</label><input id="dmpUser" autocomplete="username"></div>
        <div class="dc-row"><label>Password</label><input id="dmpPassword" type="password" autocomplete="new-password" placeholder="未配置"></div>
        <div class="dc-row">
            <label></label>
            <label class="dc-check"><input id="dmpClearPassword" type="checkbox">清除已保存密码</label>
        </div>
        <div class="dc-row"><label>最小连接数</label><input id="dmpPoolMin" type="number" min="1" max="100" value="1"></div>
        <div class="dc-row"><label>最大连接数</label><input id="dmpPoolMax" type="number" min="1" max="100" value="10"></div>
        <div class="dc-row"><label>连接超时</label><input id="dmpConnectTimeout" type="number" min="1" max="300" value="10"><span class="dc-status">秒</span></div>
        <div class="dc-row"><label>查询超时</label><input id="dmpStatementTimeout" type="number" min="1" max="3600" value="30"><span class="dc-status">秒</span></div>
        <div class="dc-row">
            <button class="btn btn-ghost" onclick="testDmpDatabase()">测试连接</button>
            <button class="btn btn-primary" onclick="saveDmpDatabase()">保存 DMP</button>
            <span id="dmpTest"></span>
        </div>
        <div id="dmpConfigStatus" class="dc-status"></div>
        <div class="dc-help"><a href="/template-binding">打开模板绑定工作台</a></div>
    </div>
    <div class="dc-card" id="servicesCard">
        <h3>🔗 外部服务</h3>
        <div class="dc-row"><label>Base URL</label><input id="svcBaseUrl" placeholder="http://43.143.68.242:9090/emviewdoctor/hdc/" style="flex:1;"></div>
        <div id="servicesList"></div>
        <button class="btn btn-ghost" onclick="addService()" style="width:100%;margin-top:8px;">+ 添加服务</button>
    </div>
    <div class="dc-card" id="medicalCatalogCard">
        <h3>病历元数据接口</h3>
        <div class="dc-row">
            <label>接口 URL</label>
            <input id="medicalCatalogUrl" type="url" placeholder="http://localhost:8006/cdr-api/standard/doc/template/node/customselect">
        </div>
        <div class="dc-row">
            <label>当前来源</label>
            <span id="medicalCatalogSource" style="font-size:12px;color:var(--text-secondary);">读取中...</span>
        </div>
        <div class="dc-help">
            URL 保存后立即生效。来源切换及外部数据状态请前往
            <a href="/templates/medical_config.html">病历元数据配置</a>。
        </div>
    </div>
    <div class="dc-save">
        <button class="btn btn-ghost" onclick="loadAll()">🔄 重新加载</button>
        <button class="btn btn-primary" onclick="saveAll()">💾 保存配置</button>
    </div>
</div>
<script>
let _services = { base_url: '', services: {} };
let _medicalCatalog = { source: 'local', external_url: '' };
let _dmpConfig = { password_configured: false, environment_overrides: [] };

function readDmpForm() {
    return {
        host: document.getElementById('dmpHost').value.trim(),
        port: parseInt(document.getElementById('dmpPort').value, 10) || 5432,
        database: document.getElementById('dmpDatabase').value.trim(),
        schema: document.getElementById('dmpSchema').value.trim() || 'sm_dmp',
        user: document.getElementById('dmpUser').value.trim(),
        password: document.getElementById('dmpPassword').value,
        pool_min: parseInt(document.getElementById('dmpPoolMin').value, 10) || 1,
        pool_max: parseInt(document.getElementById('dmpPoolMax').value, 10) || 10,
        connect_timeout_seconds: parseInt(document.getElementById('dmpConnectTimeout').value, 10) || 10,
        statement_timeout_seconds: parseInt(document.getElementById('dmpStatementTimeout').value, 10) || 30,
        clear_password: document.getElementById('dmpClearPassword').checked
    };
}

async function loadAll() {
    // Load DB config
    const r = await fetch('/api/database/config');
    const d = await r.json();
    document.getElementById('dbType').value = d.type||'iris';
    const ic = d.iris||{};
    document.getElementById('irisUrl').value = ic.base_url||'';
    document.getElementById('irisNs').value = ic.namespace||'HDCV2DEV';
    document.getElementById('irisSchema').value = ic.schema||'hdc_userv2';
    document.getElementById('irisUser').value = ic.username||'';
    document.getElementById('irisPass').value = ic.password||'';
    const mc = d.mysql||{};
    document.getElementById('mysqlHost').value = mc.host||'127.0.0.1';
    document.getElementById('mysqlPort').value = mc.port||3306;
    document.getElementById('mysqlDb').value = mc.database||'';
    document.getElementById('mysqlUser').value = mc.user||'';
    document.getElementById('mysqlPass').value = mc.password||'';
    onTypeChange();
    // Load the independent DMP/openGauss data source used by template binding.
    try {
        const dr = await fetch('/api/template-binding/database/config');
        if (!dr.ok) throw new Error(`DMP 数据源配置读取失败 (${dr.status})`);
        _dmpConfig = await dr.json();
        document.getElementById('dmpHost').value = _dmpConfig.host || '127.0.0.1';
        document.getElementById('dmpPort').value = _dmpConfig.port || 5432;
        document.getElementById('dmpDatabase').value = _dmpConfig.database || '';
        document.getElementById('dmpSchema').value = _dmpConfig.schema || 'sm_dmp';
        document.getElementById('dmpUser').value = _dmpConfig.user || '';
        document.getElementById('dmpPassword').value = '';
        document.getElementById('dmpPassword').placeholder = _dmpConfig.password_configured ? '已配置，留空保持不变' : '未配置';
        document.getElementById('dmpClearPassword').checked = false;
        document.getElementById('dmpPoolMin').value = _dmpConfig.pool_min || 1;
        document.getElementById('dmpPoolMax').value = _dmpConfig.pool_max || 10;
        document.getElementById('dmpConnectTimeout').value = _dmpConfig.connect_timeout_seconds || 10;
        document.getElementById('dmpStatementTimeout').value = _dmpConfig.statement_timeout_seconds || 30;
        const overrides = _dmpConfig.environment_overrides || [];
        document.getElementById('dmpConfigStatus').textContent = overrides.length
            ? `环境变量覆盖字段：${overrides.join('、')}`
            : (_dmpConfig.configured ? '配置已生效' : '尚未完成配置');
    } catch (error) {
        document.getElementById('dmpConfigStatus').textContent = error.message || 'DMP 数据源配置读取失败';
    }
    // Load services
    const sr = await fetch('/api/external-services/config');
    _services = await sr.json();
    document.getElementById('svcBaseUrl').value = _services.base_url||'';
    _services.services = _services.services || {};
    renderServices();
    // Load medical catalog source without changing the active source.
    const mr = await fetch('/api/medical/catalog-source');
    if (!mr.ok) throw new Error(`病历元数据配置读取失败 (${mr.status})`);
    _medicalCatalog = await mr.json();
    document.getElementById('medicalCatalogUrl').value = _medicalCatalog.external_url || '';
    document.getElementById('medicalCatalogSource').textContent =
        _medicalCatalog.source === 'external' ? '外部接口' : '本地配置';
    showToast('已加载');
}
async function saveAll() {
    const data = {
        type: document.getElementById('dbType').value,
        iris: { base_url: document.getElementById('irisUrl').value, namespace: document.getElementById('irisNs').value, schema: document.getElementById('irisSchema').value, username: document.getElementById('irisUser').value, password: document.getElementById('irisPass').value },
        mysql: { host: document.getElementById('mysqlHost').value, port: parseInt(document.getElementById('mysqlPort').value)||3306, database: document.getElementById('mysqlDb').value, user: document.getElementById('mysqlUser').value, password: document.getElementById('mysqlPass').value }
    };
    await fetch('/api/database/config', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data)});
    // Save services
    _services.base_url = document.getElementById('svcBaseUrl').value;
    await fetch('/api/external-services/config', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({base_url: _services.base_url, services: _services.services || {}})});
    // Persist the URL while preserving the source selected on the metadata page.
    const catalogResponse = await fetch('/api/medical/catalog-source', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
            source: _medicalCatalog.source || 'local',
            external_url: document.getElementById('medicalCatalogUrl').value.trim()
        })
    });
    const catalogResult = await catalogResponse.json();
    if (!catalogResponse.ok) {
        showToast(catalogResult.detail || `病历元数据接口保存失败 (${catalogResponse.status})`);
        return;
    }
    _medicalCatalog = {..._medicalCatalog, ...catalogResult};
    document.getElementById('medicalCatalogSource').textContent =
        _medicalCatalog.source === 'external' ? '外部接口' : '本地配置';
    showToast('配置已保存；病历元数据接口立即生效，数据库配置重启生效');
}

function renderServices() {
    const el = document.getElementById('servicesList');
    const services = _services.services || {};
    const keys = Object.keys(services);
    el.innerHTML = keys.map(k => {
        const s = services[k];
        return `<div class="dc-row" style="background:var(--bg-primary);padding:8px;border-radius:6px;margin-bottom:4px;">
            <input value="${escapeHtml(s.name||k)}" placeholder="名称" style="width:100px;" onchange="_services.services['${k}'].name=this.value">
            <input value="${escapeHtml(s.url||'')}" placeholder="接口路径" style="flex:1;" onchange="_services.services['${k}'].url=this.value">
            <input value="${escapeHtml((s.triggers||[]).join(','))}" placeholder="触发词" style="width:150px;" onchange="_services.services['${k}'].triggers=this.value.split(',').map(x=>x.trim()).filter(Boolean)">
            <button class="btn btn-ghost" onclick="delete _services.services['${k}']; renderServices();" style="font-size:10px;">✕</button>
        </div>`;
    }).join('');
}

function addService() {
    const id = 'svc_' + Date.now();
    _services.services = _services.services || {};
    _services.services[id] = { name: '新服务', url: '', triggers: [], method: 'POST' };
    renderServices();
}

function loadDB() { loadAll(); }
async function testDB(type) {
    const el = document.getElementById(type+'Test');
    el.innerHTML = '<span style="color:var(--text-dim);">测试中...</span>';
    try {
        const r = await fetch(`/api/database/test?type=${type}`);
        const d = await r.json();
        el.innerHTML = d.ok ? '<span class="dc-test ok">✓ 连接成功</span>' : '<span class="dc-test fail">✗ '+escapeHtml(d.error||'失败')+'</span>';
    } catch(e) {
        el.innerHTML = '<span class="dc-test fail">✗ '+escapeHtml(e.message)+'</span>';
    }
}
async function testDmpDatabase() {
    const el = document.getElementById('dmpTest');
    el.innerHTML = '<span style="color:var(--text-dim);">测试中...</span>';
    try {
        const response = await fetch('/api/template-binding/database/test', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify(readDmpForm())
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.detail || `HTTP ${response.status}`);
        el.innerHTML = '<span class="dc-test ok">连接成功</span>';
    } catch (error) {
        el.innerHTML = '<span class="dc-test fail">'+escapeHtml(error.message || '连接失败')+'</span>';
    }
}
async function saveDmpDatabase() {
    try {
        const response = await fetch('/api/template-binding/database/config', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify(readDmpForm())
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.detail || `HTTP ${response.status}`);
        _dmpConfig = result;
        document.getElementById('dmpPassword').value = '';
        document.getElementById('dmpPassword').placeholder = result.password_configured ? '已配置，留空保持不变' : '未配置';
        document.getElementById('dmpClearPassword').checked = false;
        document.getElementById('dmpConfigStatus').textContent = '配置已生效';
        showToast('DMP 数据源已保存并立即生效');
    } catch (error) {
        showToast(error.message || 'DMP 数据源保存失败');
    }
}
function onTypeChange() {
    const t = document.getElementById('dbType').value;
    document.getElementById('irisConfig').style.display = t==='iris'?'block':'none';
    document.getElementById('mysqlConfig').style.display = t==='mysql'?'block':'none';
}
function escapeHtml(s) { const d=document.createElement('div'); d.textContent=String(s||''); return d.innerHTML; }
function showToast(msg) { const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3000); }
loadDB();
</script>
</body>
</html>
